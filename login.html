<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vivor – Provider Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <style>
    :root {
      --color-primary:      #6366A8;
      --color-primary-dark: #4E5190;
      --color-accent:       #4B7DC8;
      --color-accent-hover: #3A6AB5;
      --color-border:       #DDE1EC;
      --color-text:         #2D2F4A;
      --color-text-muted:   #6B7280;
      --color-text-light:   #9CA3AF;
      --font: 'Open Sans', sans-serif;
      --radius: 4px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-size: 14px;
      background: var(--color-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    /* ── Logo ─────────────────────────────────────────────── */
    .login-logo {
      margin-bottom: 24px;
    }

    /* ── Card ─────────────────────────────────────────────── */
    .login-card {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      width: 100%;
      max-width: 360px;
      padding: 32px 32px 28px;
      text-align: center;
    }

    .login-card__title {
      font-size: 22px;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 6px;
    }

    .login-card__subtitle {
      font-size: 13px;
      color: var(--color-text-muted);
      margin-bottom: 24px;
    }

    .login-field {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 14px;
      color: var(--color-text);
      background: #fff;
      outline: none;
      margin-bottom: 12px;
      transition: border-color .15s, box-shadow .15s;
      display: block;
      text-align: left;
    }
    .login-field::placeholder { color: var(--color-text-light); }
    .login-field:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(75,125,200,.15);
    }

    .login-btn {
      width: 100%;
      padding: 11px;
      background: var(--color-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .5px;
      cursor: pointer;
      margin-bottom: 14px;
      transition: background .15s;
    }
    .login-btn:hover { background: var(--color-accent-hover); }

    .forgot-link {
      font-size: 13px;
      color: var(--color-accent);
      text-decoration: none;
    }
    .forgot-link:hover { text-decoration: underline; }

    /* ── Choice buttons ───────────────────────────────────── */
    .choice-buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      width: 100%;
      max-width: 360px;
    }

    .choice-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: var(--radius);
      cursor: pointer;
      text-align: left;
      text-decoration: none;
      transition: background .15s, border-color .15s;
    }
    .choice-btn:hover {
      background: rgba(255,255,255,.18);
      border-color: rgba(255,255,255,.40);
    }

    .choice-btn__text { flex: 1; min-width: 0; }
    .choice-btn__label {
      display: block;
      font-size: 11px;
      color: rgba(255,255,255,.70);
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 2px;
    }
    .choice-btn__action {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }
    .choice-btn .material-icons {
      font-size: 18px;
      color: rgba(255,255,255,.70);
      flex-shrink: 0;
    }

    @media (max-width: 400px) {
      .login-card { padding: 24px 20px 20px; }
      .choice-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="login-logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155.62 58.3" height="40" aria-label="Vivor">
      <style>.st0{fill:#fff}</style>
      <g><polygon class="st0" points="50.1 57.17 39.76 57.26 39.76 18.06 50.07 18.06 50.1 57.17"/><path class="st0" d="M51.06,6.02c.33,4.29-2.44,7.17-6.15,7.21-3.97.04-6.34-2.86-6.2-7,.12-3.47,2.49-6.03,5.76-6.22s6.28,2.07,6.59,6.01Z"/></g>
      <g><path class="st0" d="M155.62,28.61c-2.99.05-5.62.15-7.84,1.97-1.66,1.36-3.04,4.24-3.06,6.88l-.17,19.75h-10.91s0-39.14,0-39.14l9.6-.07.47,6.52c2.53-4.76,6.47-7.74,11.9-6.5v10.59Z"/><path class="st0" d="M107.9,58.21c-10.28-.52-17.58-8.56-18.42-18.22-.52-5.95,1.12-12.63,5.54-17.08,7.04-7.08,19.33-7.92,27.08-1.07,9.38,8.3,9.26,23.17.33,31.54-3.93,3.69-9.01,5.11-14.53,4.83ZM108.68,47.67c3.29.13,6.08-.77,8.01-3.63,2.56-3.81,2.65-9.91-.71-13.61-3.56-3.91-10.46-3.71-13.85.24-1.96,2.28-2.5,5.92-2.18,8.55.59,4.93,3.74,8.24,8.73,8.44Z"/></g>
      <g><path class="st0" d="M89.75,18.12l-10.24,32.98c-.93,3-2.91,5.9-5.92,6.83-4.53,1.39-8.96-1.32-10.28-5.82l-9.99-34.01,11.52-.07,6.66,25.14,6.53-25.07h11.72Z"/><path class="st0" d="M18.41,58.27c-8.01.48-8.77-7.73-10.83-14.16l4.01-.54-2.99-9.76c-1.27-.27-2.49-.43-4.2-.6L0,18.14c4.28-.13,7.62-.14,11.57-.02l6.51,25.04,6.62-25.15,11.65.07-10.61,34.22c-1.12,3.62-4.1,5.77-7.33,5.96Z"/></g>
    </svg>
  </div>

  <!-- Login card -->
  <div class="login-card">
    <div class="login-card__title">Provider Login</div>
    <div class="login-card__subtitle">Enter your email and password below.</div>

    <input class="login-field" type="email" placeholder="user@vivor.com" autocomplete="email" />
    <input class="login-field" type="password" value="········" autocomplete="current-password" />

    <button class="login-btn" onclick="window.location.href='alerts.html'">Submit</button>

    <a class="forgot-link" href="#">Forgot Password?</a>
  </div>

  <!-- Choice buttons -->
  <div class="choice-buttons">
    <a class="choice-btn" href="#">
      <div class="choice-btn__text">
        <span class="choice-btn__label">Logging in as a patient?</span>
        <span class="choice-btn__action">Visit the patient portal</span>
      </div>
      <span class="material-icons">chevron_right</span>
    </a>
    <a class="choice-btn" href="#">
      <div class="choice-btn__text">
        <span class="choice-btn__label">Need an account?</span>
        <span class="choice-btn__action">Request a demo</span>
      </div>
      <span class="material-icons">chevron_right</span>
    </a>
  </div>

  <!-- Demo attribution footer -->
  <div style="position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: 12px 24px; font-family: 'Open Sans', sans-serif; font-size: 12px; color: rgba(255,255,255,0.55);">
    This is a demo designed and built by <a href="https://www.katytowelldesign.com/" target="_blank" style="color: rgba(255,255,255,0.55); font-weight: 700; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.35);">Katy Towell</a>
  </div>
</body>
</html>
