<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vivor – Patients</title>

  <!-- Google Fonts: Open Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <style>
    /* ── Design tokens ────────────────────────────────────────── */
    :root {
      --color-primary:       #6366A8;   /* sidebar / brand purple  */
      --color-primary-dark:  #4E5190;   /* hover / active darken   */
      --color-primary-light: #7B7EBC;   /* active menu highlight   */
      --color-accent:        #4B7DC8;   /* blue buttons / links    */
      --color-accent-hover:  #3A6AB5;
      --color-accent-outline:#4B7DC8;

      --color-bg:            #F4F6F9;   /* main content background */
      --color-banner:        #E8EBF4;   /* "Viewing …" strip       */
      --color-surface:       #FFFFFF;
      --color-border:        #DDE1EC;
      --color-text:          #2D2F4A;   /* primary text            */
      --color-text-muted:    #6B7280;
      --color-text-light:    #9CA3AF;

      /* status chip colours */
      --chip-new-bg:        #ECFDF5;
      --chip-new-text:      #059669;
      --chip-enrolled-bg:   #EEF4FF;
      --chip-enrolled-text: #4B7DC8;
      --chip-excluded-bg:   #EBEBEB;
      --chip-excluded-text: #6B7280;

      --sidebar-width: 220px;
      --sidebar-collapsed: 64px;

      --font: 'Open Sans', sans-serif;
      --radius: 4px;
      --shadow-card: 0 1px 4px rgba(0,0,0,.10);
    }

    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      font-size: 14px;
      color: var(--color-text);
      background: var(--color-bg);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--color-primary);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      transition: transform .25s ease;
    }

    .sidebar__logo {
      padding: 20px 20px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar__nav {
      flex: 1;
      padding: 12px 0;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 20px;
      color: rgba(255,255,255,.72);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .8px;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, color .15s;
    }
    .nav-item:hover {
      background: rgba(255,255,255,.10);
      color: #fff;
    }
    .nav-item.active {
      background: var(--color-primary-dark);
      color: #fff;
      box-shadow: inset 3px 0 0 #fff;
    }
    .nav-item .material-icons {
      font-size: 20px;
      opacity: .9;
    }

    .sidebar__footer {
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,.12);
    }

    /* ── Overlay (mobile) ─────────────────────────────────────── */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 90;
    }

    /* ── Main layout ──────────────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      min-width: 0;
    }

    /* ── Top bar ──────────────────────────────────────────────── */
    .topbar {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      flex-shrink: 0;
    }
    .topbar__left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar__hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--color-text-muted);
    }
    .topbar__hamburger .material-icons { font-size: 24px; }

    .topbar__org {
      font-size: 13px;
      color: var(--color-text-muted);
    }
    .topbar__org strong { color: var(--color-text); font-weight: 600; }

    .topbar__user-wrap { position: relative; flex-shrink: 0; }
    .topbar__user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-text-muted); white-space: nowrap; cursor: pointer; user-select: none; }
    .topbar__user strong { color: var(--color-text); font-weight: 600; }
    .profile-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--color-accent); color: #fff;
      font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .user-popover {
      position: absolute; top: calc(100% + 10px); right: 0;
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius); box-shadow: 0 6px 20px rgba(0,0,0,.14);
      min-width: 160px; z-index: 400; display: none;
    }
    .user-popover.open { display: block; }
    .popover-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 16px;
      background: none; border: none; border-bottom: 1px solid var(--color-border);
      font-family: var(--font); font-size: 13px; color: var(--color-text);
      cursor: pointer; text-align: left; transition: background .1s;
    }
    .popover-item:last-child { border-bottom: none; }
    .popover-item:hover { background: #F7F8FD; }
    .popover-item .material-icons { font-size: 17px; color: var(--color-text-muted); }

    /* ── Banner strip ─────────────────────────────────────────── */
    .banner {
      background: var(--color-banner);
      padding: 7px 24px;
      font-size: 12px;
      color: var(--color-text-muted);
      text-align: center;
      flex-shrink: 0;
      border-bottom: 1px solid var(--color-border);
    }
    .banner strong { color: var(--color-text); font-weight: 600; }

    /* ── Content scroll area ──────────────────────────────────── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    /* ── Toolbar (search + buttons) ───────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-icon-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 2px;
      cursor: default;
      display: flex;
      align-items: center;
      color: var(--color-text-muted);
      border-radius: 50%;
      transition: background .12s, color .12s;
    }
    .search-icon-btn.has-value {
      cursor: pointer;
    }
    .search-icon-btn.has-value:hover {
      background: var(--color-border);
      color: var(--color-text);
    }
    .search-icon-btn .material-icons { font-size: 20px; }
    .search-input {
      width: 100%;
      padding: 9px 38px 9px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 13px;
      color: var(--color-text);
      background: var(--color-surface);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-input::placeholder { color: var(--color-text-light); }
    .search-input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(75,125,200,.15);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      white-space: nowrap;
    }
    .btn .material-icons { font-size: 18px; }

    .btn-primary {
      background: var(--color-accent);
      color: #fff;
      border: 1px solid var(--color-accent);
    }
    .btn-primary:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }

    .btn-outline {
      background: var(--color-surface);
      color: var(--color-accent);
      border: 1px solid var(--color-accent-outline);
    }
    .btn-outline:hover { background: #EEF4FF; }

    /* ── Card / table wrapper ─────────────────────────────────── */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    /* ── Table ────────────────────────────────────────────────── */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 540px;
    }

    thead tr {
      border-bottom: 1px solid var(--color-border);
    }

    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .7px;
      text-transform: uppercase;
      color: var(--color-text-muted);
      white-space: nowrap;
      user-select: none;
    }

    td {
      padding: 13px 16px;
      font-size: 13px;
      color: var(--color-text);
      border-bottom: 1px solid var(--color-border);
    }

    tbody tr:last-child td { border-bottom: none; }

    tbody tr {
      transition: background .12s;
      cursor: pointer;
    }
    tbody tr:hover { background: #F7F8FD; }

    /* Status chips */
    .chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .3px;
    }
    .chip--new      { background: var(--chip-new-bg);      color: var(--chip-new-text); }
    .chip--enrolled { background: var(--chip-enrolled-bg); color: var(--chip-enrolled-text); }
    .chip--excluded { background: var(--chip-excluded-bg); color: var(--chip-excluded-text); }

    /* ── Footer / pagination ──────────────────────────────────── */
    .table-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--color-border);
      background: var(--color-surface);
    }
    .table-footer__info {
      font-size: 12px;
      color: var(--color-text-muted);
    }

    .pagination {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .page-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      border-radius: var(--radius);
      transition: background .12s, color .12s;
    }
    .page-btn:hover:not(:disabled):not(.active) { background: #EEF4FF; border-color: var(--color-accent); color: var(--color-accent); }
    .page-btn.active { background: var(--color-accent); border-color: var(--color-accent); color: #fff; font-weight: 600; }
    .page-btn:disabled { color: var(--color-text-light); cursor: not-allowed; }
    .page-btn .material-icons { font-size: 18px; }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 768px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .main { height: auto; overflow: visible; }
      .content { overflow: visible; height: auto; }
      input, select, textarea { font-size: 16px !important; }
      .topbar { position: sticky; top: 0; z-index: 50; }
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .sidebar-overlay.visible {
        display: block;
      }
      .main {
        margin-left: 0;
      }
      .topbar__hamburger {
        display: flex;
      }
      .btn-label {
        display: none;
      }
      .btn {
        padding: 8px 10px;
      }
      .content {
        padding: 14px 12px;
      }
      .toolbar {
        gap: 8px;
      }
      .topbar__welcome { display: none; }
      .topbar__org {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: calc(100vw - 150px);
      }
    }

    @media (max-width: 480px) {
      .banner { font-size: 11px; padding: 6px 12px; }
    }
  </style>
</head>
<body>

<!-- Sidebar overlay (mobile) -->
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- ── Sidebar ──────────────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">

  <nav class="sidebar__nav">

<!-- ── Main content ─────────────────────────────────────────── -->
<div class="main">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar__left">
      <button class="topbar__hamburger" onclick="openSidebar()" aria-label="Open menu">
        <span class="material-icons">menu</span>
      </button>
      <div class="topbar__org"><strong>Northside Regional Cancer Center</strong></div>
    </div>
    <div class="topbar__user-wrap">
      <div class="topbar__user" onclick="toggleUserPopover(event)">
        <span class="topbar__welcome">Welcome, <strong>Katy</strong></span>
        <div class="profile-avatar">K</div>

      <div class="user-popover" id="userPopover">
        <button class="popover-item"><span class="material-icons">person_outline</span>Profile</button>
        <button class="popover-item" onclick="window.location.href='login.html'"><span class="material-icons">logout</span>Log Out</button>
      </div>
    </div>
  </header>

  <!-- Banner (hidden on desktop since it's embedded in topbar; visible as separate strip matching screenshot) -->
  <div class="banner" id="banner-strip"><strong>Northside Regional Cancer Center</strong></div>

  <!-- Scrollable content -->
  <div class="content">

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <input class="search-input" type="text" placeholder="Search Patient List..." id="searchInput" oninput="filterPatients()" />
        <button class="search-icon-btn" id="searchClearBtn" onclick="clearSearch()" title="Clear search" tabindex="-1">
          <span class="material-icons" id="searchIcon">search</span>
        </button>
      </div>
      <button class="btn btn-primary">
        <span class="material-icons">add_circle_outline</span>
        <span class="btn-label">Add Patient</span>
      </button>
      <button class="btn btn-outline">
        <span class="material-icons">file_upload</span>
        <span class="btn-label">Export</span>
      </button>
      <button class="btn btn-outline">
        <span class="material-icons">filter_list</span>
        <span class="btn-label">Show Filters</span>
      </button>
    </div>

    <!-- Table card -->
    <div class="card">
      <div class="table-wrap">
        <table id="patientTable">
          <thead>
            <tr>
              <th>Last Name</th>
              <th>First Name</th>
              <th>MRN</th>
              <th>Programs</th>
              <th>Status</th>
              <th>Assigned To</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>

      <div class="table-footer">
        <div class="table-footer__info" id="footerInfo"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>

  </div><!-- /content -->

<script>
  /* ── Data ─────────────────────────────────────────────────── */
  const ALL_PATIENTS = [
    { last: 'Agbayani',   first: 'Abdul',    mrn: '8808280', programs: 5, status: 'New',      assigned: '' },
    { last: 'Alderink',   first: 'Austin',   mrn: '9713387', programs: 0, status: 'Excluded', assigned: 'M. Torres' },
    { last: 'Bacon',      first: 'Amy',      mrn: '8736982', programs: 2, status: 'New',      assigned: '' },
    { last: 'Baldonado',  first: 'Ramiro',   mrn: '8672204', programs: 0, status: 'New',      assigned: '' },
    { last: 'Bernosky',   first: 'Jennie',   mrn: '5409906', programs: 2, status: 'New',      assigned: '' },
    { last: 'Beuerle',    first: 'Priscilla',mrn: '1632389', programs: 0, status: 'New',      assigned: '' },
    { last: 'Bobe',       first: 'Jonna',    mrn: '8042850', programs: 0, status: 'Enrolled', assigned: 'J. Nakamura' },
    { last: 'Botticello', first: 'Noel',     mrn: '2516570', programs: 0, status: 'Enrolled', assigned: 'R. Patel' },
    { last: 'Bowne',      first: 'Russell',  mrn: '9821085', programs: 0, status: 'Excluded', assigned: 'J. Nakamura' },
    { last: 'Brigante',   first: 'Ahmad',    mrn: '6098469', programs: 0, status: 'Excluded', assigned: 'M. Torres' },
    { last: 'Brooks',     first: 'Marcus',   mrn: '7234510', programs: 1, status: 'New',      assigned: '' },
    { last: 'Cabrera',    first: 'Diana',    mrn: '3398120', programs: 3, status: 'Enrolled', assigned: 'R. Patel' },
    { last: 'Campbell',   first: 'Sandra',   mrn: '6612087', programs: 0, status: 'Excluded', assigned: 'M. Torres' },
    { last: 'Castillo',   first: 'Miguel',   mrn: '1120934', programs: 4, status: 'Enrolled', assigned: 'R. Patel' },
    { last: 'Chen',       first: 'Li',       mrn: '9905432', programs: 2, status: 'New',      assigned: '' },
    { last: 'Coleman',    first: 'Robert',   mrn: '2287641', programs: 0, status: 'New',      assigned: '' },
    { last: 'Cortez',     first: 'Elena',    mrn: '4471892', programs: 1, status: 'Enrolled', assigned: 'J. Nakamura' },
    { last: 'Davis',      first: 'Patricia', mrn: '7753219', programs: 0, status: 'Excluded', assigned: 'R. Patel' },
    { last: 'Diaz',       first: 'Carlos',   mrn: '8834076', programs: 3, status: 'New',      assigned: '' },
    { last: 'Edwards',    first: 'Betty',    mrn: '5561238', programs: 0, status: 'New',      assigned: '' },
  ];

  const PAGE_SIZE = 10;
  let currentPage = 1;
  let filteredPatients = [...ALL_PATIENTS];

  /* ── Chip helper ──────────────────────────────────────────── */
  function chipClass(status) {
    const map = { 'New': 'chip--new', 'Enrolled': 'chip--enrolled', 'Excluded': 'chip--excluded' };
    return map[status] || '';
  }

  /* ── Render ───────────────────────────────────────────────── */
  function render() {
    const total = filteredPatients.length;
    const totalAll = ALL_PATIENTS.length;
    const start = (currentPage - 1) * PAGE_SIZE;
    const end   = Math.min(start + PAGE_SIZE, total);
    const page  = filteredPatients.slice(start, end);

    // Table body
    const tbody = document.getElementById('tableBody');
    if (page.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--color-text-muted);">No patients found.</td></tr>`;
    } else {
      tbody.innerHTML = page.map(p => {
        const qs = `mrn=${p.mrn}&last=${encodeURIComponent(p.last)}&first=${encodeURIComponent(p.first)}&status=${encodeURIComponent(p.status)}&programs=${p.programs}&assigned=${encodeURIComponent(p.assigned)}`;
        return `
        <tr onclick="window.location='patient-detail.html?${qs}'" style="cursor:pointer;">
          <td>${p.last}</td>
          <td>${p.first}</td>
          <td>${p.mrn}</td>
          <td>${p.programs}</td>
          <td><span class="chip ${chipClass(p.status)}">${p.status}</span></td>
          <td>${p.assigned}</td>
        </tr>`;
      }).join('');
    }

    // Footer info
    document.getElementById('footerInfo').textContent =
      total === 0
        ? 'No patients found'
        : `Showing ${start + 1} to ${end} of ${total} patients (filtered from ${totalAll} total)`;

    // Pagination
    renderPagination(total);
  }

  function renderPagination(total) {
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const pg = document.getElementById('pagination');
    let html = '';

    html += `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
               <span class="material-icons">chevron_left</span>
             </button>`;

    // Show up to 5 page numbers around current
    const range = pageRange(currentPage, totalPages);
    range.forEach(n => {
      if (n === '…') {
        html += `<button class="page-btn" disabled>…</button>`;
      } else {
        html += `<button class="page-btn ${n === currentPage ? 'active' : ''}" onclick="goPage(${n})">${n}</button>`;
      }
    });

    html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
               <span class="material-icons">chevron_right</span>
             </button>`;

    pg.innerHTML = html;
  }

  function pageRange(cur, total) {
    if (total <= 7) return Array.from({length: total}, (_, i) => i + 1);
    const pages = [];
    if (cur <= 4) {
      for (let i = 1; i <= 5; i++) pages.push(i);
      pages.push('…', total);
    } else if (cur >= total - 3) {
      pages.push(1, '…');
      for (let i = total - 4; i <= total; i++) pages.push(i);
    } else {
      pages.push(1, '…', cur - 1, cur, cur + 1, '…', total);
    }
    return pages;
  }

  function goPage(n) {
    const totalPages = Math.ceil(filteredPatients.length / PAGE_SIZE);
    if (n < 1 || n > totalPages) return;
    currentPage = n;
    render();
  }

  /* ── Search / filter ──────────────────────────────────────── */
  function filterPatients() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    filteredPatients = q
      ? ALL_PATIENTS.filter(p =>
          p.last.toLowerCase().includes(q) ||
          p.first.toLowerCase().includes(q) ||
          p.mrn.includes(q) ||
          p.status.toLowerCase().includes(q))
      : [...ALL_PATIENTS];
    currentPage = 1;
    render();
    updateSearchIcon('searchInput', 'searchIcon', 'searchClearBtn');
  }

  function clearSearch() {
    const input = document.getElementById('searchInput');
    input.value = '';
    filterPatients();
    input.focus();
  }

  function updateSearchIcon(inputId, iconId, btnId) {
    const val = document.getElementById(inputId).value;
    document.getElementById(iconId).textContent = val ? 'close' : 'search';
    document.getElementById(btnId).classList.toggle('has-value', !!val);
  }

  /* ── User popover ─────────────────────────────────────────── */
  function toggleUserPopover(e) {
    e.stopPropagation();
    document.getElementById('userPopover').classList.toggle('open');
  }
  document.addEventListener('click', e => {
    const userWrap = document.querySelector('.topbar__user-wrap');
    if (userWrap && !userWrap.contains(e.target)) {
      document.getElementById('userPopover').classList.remove('open');
    }
  });

  /* ── Sidebar (mobile) ─────────────────────────────────────── */
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('visible');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('visible');
  }

  /* ── Hide duplicate banner on desktop ─────────────────────── */
  function syncBanner() {
    const banner = document.getElementById('banner-strip');
    // On desktop the topbar already shows the org; hide the banner strip
    if (window.innerWidth > 480) {
      banner.style.display = 'none';
    } else {
      banner.style.display = 'block';
    }
  }
  window.addEventListener('resize', syncBanner);

  /* ── Init ─────────────────────────────────────────────────── */
  syncBanner();
  render();
</script>
</body>
</html>
