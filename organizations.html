<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vivor – Organizations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <style>
    /* ── Design tokens ──────────────────────────────────────── */
    :root {
      --color-primary:      #6366A8;
      --color-primary-dark: #4E5190;
      --color-accent:       #4B7DC8;
      --color-accent-hover: #3A6AB5;

      --color-bg:           #F4F6F9;
      --color-surface:      #FFFFFF;
      --color-border:       #DDE1EC;
      --color-text:         #2D2F4A;
      --color-text-muted:   #6B7280;
      --color-text-light:   #9CA3AF;

      --sidebar-width: 220px;
      --font: 'Open Sans', sans-serif;
      --radius: 4px;
      --shadow-card: 0 1px 4px rgba(0,0,0,.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-size: 14px;
      color: var(--color-text);
      background: var(--color-bg);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--color-primary);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: fixed;
      top: 0; left: 0;
      z-index: 100;
      transition: transform .25s ease;
    }
    .sidebar__logo {
      padding: 20px 20px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar__nav { flex: 1; padding: 12px 0; overflow-y: auto; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 20px;
      color: rgba(255,255,255,.72);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .8px;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, color .15s;
    }
    .nav-item:hover { background: rgba(255,255,255,.10); color: #fff; }
    .nav-item.active {
      background: var(--color-primary-dark);
      color: #fff;
      box-shadow: inset 3px 0 0 #fff;
    }
    .nav-item .material-icons { font-size: 20px; opacity: .9; }
    .sidebar__footer { padding: 12px 0; border-top: 1px solid rgba(255,255,255,.12); }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 90;
    }

    /* ── Main ─────────────────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      min-width: 0;
    }

    /* ── Topbar ───────────────────────────────────────────── */
    .topbar {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      flex-shrink: 0;
      gap: 16px;
    }
    .topbar__left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }
    .topbar__hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }
    .topbar__hamburger .material-icons { font-size: 24px; }

    /* Global patient search */
    .topbar-search {
      flex: 1;
      max-width: 380px;
      position: relative;
    }
    .topbar-search input {
      width: 100%;
      padding: 7px 34px 7px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 13px;
      color: var(--color-text);
      background: var(--color-bg);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .topbar-search input::placeholder { color: var(--color-text-light); }
    .topbar-search input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(75,125,200,.15);
      background: var(--color-surface);
    }
    .search-icon-btn {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 2px;
      cursor: default;
      display: flex;
      align-items: center;
      color: var(--color-text-muted);
      border-radius: 50%;
      transition: background .12s, color .12s;
      z-index: 2;
    }
    .search-icon-btn.has-value { cursor: pointer; }
    .search-icon-btn.has-value:hover { background: var(--color-border); color: var(--color-text); }
    .search-icon-btn .material-icons { font-size: 18px; }

    /* Autocomplete dropdown */
    .autocomplete-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: 0 6px 20px rgba(0,0,0,.12);
      max-height: 320px;
      overflow-y: auto;
      z-index: 300;
    }
    .autocomplete-dropdown.open { display: block; }
    .autocomplete-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      text-decoration: none;
      color: var(--color-text);
      font-size: 13px;
      transition: background .1s;
      border-bottom: 1px solid var(--color-border);
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: #F7F8FD; }
    .autocomplete-item .material-icons { font-size: 18px; color: var(--color-text-muted); flex-shrink: 0; }
    .autocomplete-item__name { font-weight: 600; line-height: 1.3; }
    .autocomplete-item__meta { font-size: 11px; color: var(--color-text-muted); margin-top: 1px; }
    .autocomplete-item .chip { font-size: 10px; padding: 1px 7px; vertical-align: middle; }
    .autocomplete-no-results { padding: 14px; text-align: center; color: var(--color-text-muted); font-size: 13px; }

    /* Status chips (for patient autocomplete) */
    .chip { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .chip--new      { background: #ECFDF5; color: #059669; }
    .chip--enrolled { background: #EEF4FF; color: #4B7DC8; }
    .chip--excluded { background: #EBEBEB; color: #6B7280; }

    .topbar__org { font-size: 13px; color: var(--color-text-muted); }
    .topbar__org strong { color: var(--color-text); font-weight: 600; }

    .topbar__user-wrap { position: relative; flex-shrink: 0; }
    .topbar__user { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--color-text-muted); white-space: nowrap; cursor: pointer; user-select: none; }
    .topbar__user strong { color: var(--color-text); font-weight: 600; }
    .topbar__user .material-icons { font-size: 18px; color: var(--color-accent); }
    .user-popover {
      position: absolute; top: calc(100% + 10px); right: 0;
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius); box-shadow: 0 6px 20px rgba(0,0,0,.14);
      min-width: 160px; z-index: 400; display: none;
    }
    .user-popover.open { display: block; }
    .popover-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 16px;
      background: none; border: none; border-bottom: 1px solid var(--color-border);
      font-family: var(--font); font-size: 13px; color: var(--color-text);
      cursor: pointer; text-align: left; transition: background .1s;
    }
    .popover-item:last-child { border-bottom: none; }
    .popover-item:hover { background: #F7F8FD; }
    .popover-item .material-icons { font-size: 17px; color: var(--color-text-muted); }

    /* ── Content ──────────────────────────────────────────── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    /* ── Toolbar ──────────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .org-search-wrap {
      flex: 1;
      min-width: 220px;
      position: relative;
    }
    .org-search-wrap .search-icon-btn { right: 8px; }
    .org-search-wrap .search-icon-btn .material-icons { font-size: 20px; }
    .org-search-input {
      width: 100%;
      padding: 9px 38px 9px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 13px;
      color: var(--color-text);
      background: var(--color-surface);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .org-search-input::placeholder { color: var(--color-text-light); }
    .org-search-input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(75,125,200,.15);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      white-space: nowrap;
      border: none;
    }
    .btn .material-icons { font-size: 18px; }
    .btn-primary { background: var(--color-accent); color: #fff; border: 1px solid var(--color-accent); }
    .btn-primary:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }

    /* ── Card / table ─────────────────────────────────────── */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    thead tr { border-bottom: 1px solid var(--color-border); }
    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .7px;
      text-transform: uppercase;
      color: var(--color-text-muted);
      white-space: nowrap;
      user-select: none;
      cursor: pointer;
    }
    th:hover { color: var(--color-text); }
    th .sort-icon { font-size: 14px; vertical-align: middle; opacity: .4; transition: opacity .15s; }
    th.sorted .sort-icon { opacity: 1; color: var(--color-accent); }

    td {
      padding: 13px 16px;
      font-size: 13px;
      color: var(--color-text);
      border-bottom: 1px solid var(--color-border);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .12s; cursor: pointer; }
    tbody tr:hover { background: #F7F8FD; }

    .org-name-link {
      color: var(--color-accent);
      font-weight: 600;
      text-decoration: none;
    }
    .org-name-link:hover { text-decoration: underline; }

    .status-active {
      color: var(--color-text-muted);
      font-size: 13px;
    }

    .you-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
      background: var(--color-primary);
      color: #fff;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }

    .table-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--color-border);
      background: var(--color-surface);
    }
    .table-footer__info { font-size: 12px; color: var(--color-text-muted); }

    /* ── Responsive ───────────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.visible { display: block; }
      .main { margin-left: 0; }
      .topbar__hamburger { display: flex; }
      .content { padding: 14px 12px; }
      .topbar-search { max-width: 200px; }
    }
    @media (max-width: 480px) {
      .topbar-search { display: none; }
      .btn-label { display: none; }
      .btn { padding: 8px 10px; }
    }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- ── Sidebar ──────────────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar__logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155.62 58.3" height="32" aria-label="Vivor">
      <style>.st0{fill:#fff}</style>
      <g><polygon class="st0" points="50.1 57.17 39.76 57.26 39.76 18.06 50.07 18.06 50.1 57.17"/><path class="st0" d="M51.06,6.02c.33,4.29-2.44,7.17-6.15,7.21-3.97.04-6.34-2.86-6.2-7,.12-3.47,2.49-6.03,5.76-6.22s6.28,2.07,6.59,6.01Z"/></g>
      <g><path class="st0" d="M155.62,28.61c-2.99.05-5.62.15-7.84,1.97-1.66,1.36-3.04,4.24-3.06,6.88l-.17,19.75h-10.91s0-39.14,0-39.14l9.6-.07.47,6.52c2.53-4.76,6.47-7.74,11.9-6.5v10.59Z"/><path class="st0" d="M107.9,58.21c-10.28-.52-17.58-8.56-18.42-18.22-.52-5.95,1.12-12.63,5.54-17.08,7.04-7.08,19.33-7.92,27.08-1.07,9.38,8.3,9.26,23.17.33,31.54-3.93,3.69-9.01,5.11-14.53,4.83ZM108.68,47.67c3.29.13,6.08-.77,8.01-3.63,2.56-3.81,2.65-9.91-.71-13.61-3.56-3.91-10.46-3.71-13.85.24-1.96,2.28-2.5,5.92-2.18,8.55.59,4.93,3.74,8.24,8.73,8.44Z"/></g>
      <g><path class="st0" d="M89.75,18.12l-10.24,32.98c-.93,3-2.91,5.9-5.92,6.83-4.53,1.39-8.96-1.32-10.28-5.82l-9.99-34.01,11.52-.07,6.66,25.14,6.53-25.07h11.72Z"/><path class="st0" d="M18.41,58.27c-8.01.48-8.77-7.73-10.83-14.16l4.01-.54-2.99-9.76c-1.27-.27-2.49-.43-4.2-.6L0,18.14c4.28-.13,7.62-.14,11.57-.02l6.51,25.04,6.62-25.15,11.65.07-10.61,34.22c-1.12,3.62-4.1,5.77-7.33,5.96Z"/></g>
    </svg>
  </div>
  <nav class="sidebar__nav">
    <a class="nav-item" href="alerts.html">
      <span class="material-icons">notifications</span>Alerts
    </a>
    <a class="nav-item active" href="organizations.html">
      <span class="material-icons">business</span>Organizations
    </a>
    <a class="nav-item" href="patients.html">
      <span class="material-icons">people</span>Patients
    </a>
    <a class="nav-item" href="one-time-search.html">
      <span class="material-icons">manage_search</span>One-Time Search
    </a>
  </nav>
  <div class="sidebar__footer">
    <a class="nav-item" href="#">
      <span class="material-icons">help_outline</span>Support
    </a>
  </div>
</aside>

<!-- ── Main ─────────────────────────────────────────────────── -->
<div class="main">

  <header class="topbar">
    <div class="topbar__left">
      <button class="topbar__hamburger" onclick="openSidebar()" aria-label="Open menu">
        <span class="material-icons">menu</span>
      </button>
      <div class="topbar__org"><strong>Northside Regional Cancer Center</strong></div>
    </div>
    <div class="topbar__user-wrap">
      <div class="topbar__user" onclick="toggleUserPopover(event)">
        Welcome, <strong>Katy</strong>
        <span class="material-icons">settings</span>
      </div>
      <div class="user-popover" id="userPopover">
        <button class="popover-item"><span class="material-icons">person_outline</span>Profile</button>
        <button class="popover-item" onclick="window.location.href='login.html'"><span class="material-icons">logout</span>Log Out</button>
      </div>
    </div>
  </header>

  <div class="content">

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="org-search-wrap">
        <input class="org-search-input" type="text" placeholder="Search Organization List..."
               id="orgSearch" oninput="filterOrgs()" autocomplete="off" />
        <button class="search-icon-btn" id="orgClearBtn"
                onclick="clearOrgSearch()" title="Clear" tabindex="-1">
          <span class="material-icons" id="orgSearchIcon">search</span>
        </button>
      </div>
      <button class="btn btn-primary">
        <span class="material-icons">add_circle_outline</span>
        <span class="btn-label">Add Organization</span>
      </button>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th onclick="sortBy('name')"    id="th-name">
                Name <span class="material-icons sort-icon" id="si-name">unfold_more</span>
              </th>
              <th onclick="sortBy('users')"   id="th-users">
                Users <span class="material-icons sort-icon" id="si-users">unfold_more</span>
              </th>
              <th onclick="sortBy('active')"  id="th-active">
                Active Users <span class="material-icons sort-icon" id="si-active">unfold_more</span>
              </th>
              <th onclick="sortBy('patients')" id="th-patients">
                Total Patients <span class="material-icons sort-icon" id="si-patients">unfold_more</span>
              </th>
              <th onclick="sortBy('login')"   id="th-login">
                Last Login <span class="material-icons sort-icon" id="si-login">unfold_more</span>
              </th>
              <th onclick="sortBy('status')"  id="th-status">
                Status <span class="material-icons sort-icon" id="si-status">unfold_more</span>
              </th>
            </tr>
          </thead>
          <tbody id="orgTableBody"></tbody>
        </table>
      </div>
      <div class="table-footer">
        <div class="table-footer__info" id="orgFooterInfo"></div>
      </div>
    </div>

  </div>
</div>

<script>
  /* ── Organization data ──────────────────────────────────── */
  const ALL_ORGS = [
    { name: 'Northside Regional Cancer Center', current: true,  users: 12, active: 4, patients: 284, loginMs: Date.now() - 1000*60*60*2,     lastLogin: '2 hours ago',   status: 'Active' },
    { name: 'Northside General Hospital',       current: false, users: 8,  active: 3, patients: 412, loginMs: Date.now() - 1000*60*60*24*4,  lastLogin: '4 days ago',    status: 'Active' },
    { name: 'Northside Medical Center – East',  current: false, users: 5,  active: 1, patients: 97,  loginMs: Date.now() - 1000*60*60*24*11, lastLogin: '11 days ago',   status: 'Active' },
    { name: 'Northside Specialty Care Institute', current: false, users: 3, active: 1, patients: 53, loginMs: Date.now() - 1000*60*60*24*22, lastLogin: '22 days ago',   status: 'Active' },
    { name: 'Northside Community Health Center', current: false, users: 2, active: 0, patients: 0,  loginMs: null,                           lastLogin: '—',             status: 'Inactive' },
  ];

  let filteredOrgs = [...ALL_ORGS];
  let sortCol = 'name';
  let sortDir = 'asc';

  /* ── Render ─────────────────────────────────────────────── */
  function render() {
    const tbody = document.getElementById('orgTableBody');
    tbody.innerHTML = filteredOrgs.map(o => `
      <tr>
        <td>
          <a class="org-name-link" href="#">${o.name}</a>
          ${o.current ? '<span class="you-badge">You</span>' : ''}
        </td>
        <td>${o.users}</td>
        <td>${o.active}</td>
        <td>${o.patients > 0 ? o.patients.toLocaleString() : o.patients}</td>
        <td style="color:var(--color-text-muted)">${o.lastLogin}</td>
        <td class="status-active">${o.status}</td>
      </tr>`).join('');

    const total = ALL_ORGS.length;
    const shown = filteredOrgs.length;
    document.getElementById('orgFooterInfo').textContent =
      shown === total
        ? `Showing ${total} organization${total !== 1 ? 's' : ''}`
        : `Showing ${shown} of ${total} organizations`;
  }

  /* ── Sort ───────────────────────────────────────────────── */
  const SORT_KEYS = { name: 'name', users: 'users', active: 'active', patients: 'patients', login: 'loginMs', status: 'status' };

  function sortBy(col) {
    if (sortCol === col) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortCol = col;
      sortDir = 'asc';
    }

    const key = SORT_KEYS[col];
    filteredOrgs.sort((a, b) => {
      let av = a[key], bv = b[key];
      if (av === null) av = sortDir === 'asc' ? Infinity : -Infinity;
      if (bv === null) bv = sortDir === 'asc' ? Infinity : -Infinity;
      if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir === 'asc' ? av - bv : bv - av;
    });

    // Update header icons
    document.querySelectorAll('th').forEach(th => th.classList.remove('sorted'));
    document.querySelectorAll('.sort-icon').forEach(ic => ic.textContent = 'unfold_more');
    const thEl = document.getElementById(`th-${col}`);
    const siEl = document.getElementById(`si-${col}`);
    if (thEl) thEl.classList.add('sorted');
    if (siEl) siEl.textContent = sortDir === 'asc' ? 'arrow_upward' : 'arrow_downward';

    render();
  }

  /* ── Org search / filter ────────────────────────────────── */
  function filterOrgs() {
    const q = document.getElementById('orgSearch').value.trim().toLowerCase();
    filteredOrgs = q
      ? ALL_ORGS.filter(o => o.name.toLowerCase().includes(q) || o.status.toLowerCase().includes(q))
      : [...ALL_ORGS];
    applySortToFiltered();
    render();
    updateIcon('orgSearch', 'orgSearchIcon', 'orgClearBtn');
  }

  function clearOrgSearch() {
    document.getElementById('orgSearch').value = '';
    filterOrgs();
    document.getElementById('orgSearch').focus();
  }

  function applySortToFiltered() {
    const key = SORT_KEYS[sortCol];
    filteredOrgs.sort((a, b) => {
      let av = a[key], bv = b[key];
      if (av === null) av = sortDir === 'asc' ? Infinity : -Infinity;
      if (bv === null) bv = sortDir === 'asc' ? Infinity : -Infinity;
      if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir === 'asc' ? av - bv : bv - av;
    });
  }

  /* ── Shared icon toggle helper ──────────────────────────── */
  function updateIcon(inputId, iconId, btnId) {
    const val = document.getElementById(inputId).value;
    document.getElementById(iconId).textContent = val ? 'close' : 'search';
    document.getElementById(btnId).classList.toggle('has-value', !!val);
  }

  function buildPatientUrl(p) {
    return `patient-detail.html?mrn=${p.mrn}&last=${encodeURIComponent(p.last)}&first=${encodeURIComponent(p.first)}&status=${encodeURIComponent(p.status)}&programs=${p.programs}&assigned=${encodeURIComponent(p.assigned)}`;
  }

  function chipClass(s) {
    return { New: 'chip--new', Enrolled: 'chip--enrolled', Excluded: 'chip--excluded' }[s] || '';
  }

  function handleTopbarSearch() {
    const q = document.getElementById('topbarSearch').value.trim().toLowerCase();
    const dropdown = document.getElementById('autocompleteDropdown');
    updateIcon('topbarSearch', 'topbarSearchIcon', 'topbarClearBtn');
    if (!q) { dropdown.classList.remove('open'); dropdown.innerHTML = ''; return; }

    const matches = ALL_PATIENTS.filter(p =>
      p.last.toLowerCase().includes(q) ||
      p.first.toLowerCase().includes(q) ||
      `${p.first} ${p.last}`.toLowerCase().includes(q) ||
      p.mrn.includes(q)
    ).slice(0, 8);

    dropdown.innerHTML = matches.length === 0
      ? `<div class="autocomplete-no-results">No patients found</div>`
      : matches.map(p => `
          <a class="autocomplete-item" href="${buildPatientUrl(p)}">
            <span class="material-icons">person</span>
            <div>
              <div class="autocomplete-item__name">${p.first} ${p.last}</div>
              <div class="autocomplete-item__meta">MRN ${p.mrn} &nbsp;·&nbsp;
                <span class="chip ${chipClass(p.status)}">${p.status}</span>
              </div>
            </div>
          </a>`).join('');
    dropdown.classList.add('open');
  }

  function clearTopbarSearch() {
    document.getElementById('topbarSearch').value = '';
    updateIcon('topbarSearch', 'topbarSearchIcon', 'topbarClearBtn');
    const dd = document.getElementById('autocompleteDropdown');
    dd.classList.remove('open');
    dd.innerHTML = '';
    document.getElementById('topbarSearch').focus();
  }

  document.addEventListener('click', e => {
    const userWrap = document.querySelector('.topbar__user-wrap');
    if (userWrap && !userWrap.contains(e.target)) {
      document.getElementById('userPopover').classList.remove('open');
    }
  });

  function toggleUserPopover(e) {
    e.stopPropagation();
    document.getElementById('userPopover').classList.toggle('open');
  }

  /* ── Sidebar (mobile) ───────────────────────────────────── */
  function openSidebar()  { document.getElementById('sidebar').classList.add('open');    document.getElementById('overlay').classList.add('visible'); }
  function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('visible'); }

  /* ── Init ───────────────────────────────────────────────── */
  render();
</script>
